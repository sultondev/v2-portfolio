<script>
  // Hide loader once React has rendered something into #root, or after a safety timeout.
  (function () {
    var loader = document.getElementById("loader");
    if (!loader) return;
    var dismiss = function () {
      if (loader.classList.contains("is-out")) return;
      loader.classList.add("is-out");
      setTimeout(function () { loader.remove(); }, 600);
    };
    var minShown = Date.now() + 350; // keep loader at least 350ms to avoid flicker
    var attempt = function () {
      var root = document.getElementById("root");
      var ready = root && root.childElementCount > 0;
      if (ready && Date.now() >= minShown) {
        dismiss();
      } else {
        requestAnimationFrame(attempt);
      }
    };
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", attempt);
    } else {
      attempt();
    }
    setTimeout(dismiss, 8000); // hard fallback
  })();
</script>
